<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Sterowania - Izba Przyjęć</title>
    <link rel="stylesheet" href="../static/style_panel.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

<h1>Panel Wezwań Pacjentów</h1>

<!-- Sekcja wpisywania numeru pacjenta -->
<div class="number-section">
    <label for="patientNumber" class="custom-label">Numer pacjenta:</label>
    <input type="number" id="patientNumber" placeholder="np. 8" min="1">
</div>

<div class="grid">
    <button class="btn" onclick="send('ZAPRASZAMY DO GABINETU NR 1')">Gabinet nr 1</button>
    <button class="btn" onclick="send('ZAPRASZAMY DO GABINETU NR 2')">Gabinet nr 2</button>
    <button class="btn" onclick="send('ZAPRASZAMY DO REJESTRACJI')">Rejestracja</button>
    <button class="btn btn-urgent" onclick="send('NASTĘPNY PACJENT')">Następny pacjent</button>
</div>

<div class="custom-section">
    <label for="customText" class="custom-label">Wpisz własny komunikat:</label>
    <div class="input-group">
        <input type="text" id="customText" placeholder="np. PROSZĘ O SPOKOJNE OCZEKIWANIE">
        <button class="btn btn-send" onclick="sendCustom()">Wyślij</button>
    </div>
</div>

<div class="doctor-control-section">
    <label for="doctorInput">Lekarz dyżurny:</label>
    <input type="text" id="doctorInput" placeholder="Imię i nazwisko lekarza">
    <button onclick="updateDoctor()">Zapisz lekarza</button>
</div>

<script>
    var socket = io({transports: ['polling']});

    function send(actionText) {
        const numberInput = document.getElementById('patientNumber');
        const num = numberInput.value.trim();

        let fullText = actionText;

        // Jeśli podano numer, doklejamy go na początku komunikatu
        if (num !== '') {
            fullText = `NUMER ${num} - ${actionText}`;
        }

        socket.emit('send_message', { text: fullText.toUpperCase(), duration: 15 });

        // Czyszczenie pola z numerem po wywołaniu
        numberInput.value = '';
    }

    function sendCustom() {
        const input = document.getElementById('customText');
        if (input.value.trim() !== '') {
            send(input.value.toUpperCase());
            input.value = '';
        }
    }

    function updateDoctor() {
        const doctorName = document.getElementById('doctorInput').value;
        socket.emit('change_doctor', { doctor: doctorName });
    }

    socket.on('update_doctor', function(data) {
        document.getElementById('doctorInput').value = data.doctor;
    });
</script>

</body>
</html>
